[package]
name = "fractaldesk"
version = "1.0.0"
edition = "2021"
description = "FractalDesk — palette editor and vsix packager for the Daylight & Lamplight themes"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
